name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Typecheck, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  database:
    name: RLS and integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dxo_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: directorxo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dxo_admin -d directorxo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Auth rate limiting (integration tests exercise the Redis store).
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # SMTP sink for the email adapter integration test.
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      CI: "true"
      TEST_ADMIN_DATABASE_URL: postgresql://dxo_admin:ci-admin-password@localhost:5432/directorxo_test
      DB_APP_PASSWORD: ci-app-password
      DB_AUTH_PASSWORD: ci-auth-password
      DB_MIGRATOR_PASSWORD: ci-migrator-password
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Schema is in sync with migrations
        run: |
          pnpm drizzle-kit generate --name=ci_drift_check
          git status --porcelain db/migrations | tee /tmp/drift
          test ! -s /tmp/drift || (echo "Schema changes without a committed migration" && exit 1)
      - run: pnpm test:db

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security:
    name: Secrets and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Production dependencies (blocking)
        run: pnpm audit --prod --audit-level high
      - name: All dependencies (report only)
        run: pnpm audit --audit-level high || true
